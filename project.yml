name: ShopFloorPlanner
options:
  bundleIdPrefix: com.lordhater
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  ShopFloorPlanner:
    type: application
    platform: macOS
    sources:
      - path: Sources/ShopFloorPlanner
        excludes:
          - Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lordhater.shopfloorplanner.app
      PRODUCT_NAME: ShopFloorPlanner
      INFOPLIST_FILE: ShopFloorPlanner/Info.plist
      CODE_SIGN_STYLE: Automatic
      SWIFT_VERSION: "6.0"
    info:
      path: ShopFloorPlanner/Info.plist
      properties:
        CFBundleName: ShopFloorPlanner
        CFBundleDisplayName: ShopFloor Planner
        CFBundleIdentifier: com.lordhater.shopfloorplanner.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "14.0"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.lordhater.shopfloorplanner
            UTTypeDescription: ShopFloor Planner Document
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - sfp
        CFBundleDocumentTypes:
          - CFBundleTypeName: ShopFloor Planner Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.lordhater.shopfloorplanner

  ShopFloorPlannerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ShopFloorPlannerTests
    dependencies:
      - target: ShopFloorPlanner
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lordhater.shopfloorplanner.tests
